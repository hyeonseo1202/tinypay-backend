spring:
  datasource:
    url: jdbc:mysql://${MYSQL_URL}:${MYSQL_PORT}/${MYSQL_DB}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  profiles:
    active: local

  servlet:
    multipart:
      enabled: true
      max-file-size: 3MB
      max-request-size: 5MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

jwt:
  secret: ${JWT_SECRET}
  expiration: 2419200000
  refresh-expiration: 2419200000

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: ${S3_BUCKET_NAME}

google:
  client-id: ${GOOGLE_CLIENT_ID}

coolsms:
  api-key: ${COOLSMS_API_KEY}
  api-secret: ${COOLSMS_API_SECRET}
  from-number: ${COOLSMS_FROM_NUMBER}


dify:
  base-url: ${DIFY_BASE_URL}
  chat-analysis-api-key: ${DIFY_CHAT_ANALYSIS_API_KEY}
  service-execution-api-key: ${DIFY_SERVICE_EXECUTION_API_KEY}

blockchain:
  rpc-url: ${BLOCKCHAIN_RPC_URL}
  chain-id: 80002
  mock-usdc-address: ${MOCK_USDC_ADDRESS}
  tiny-payment-address: ${TINY_PAYMENT_ADDRESS}
  server-wallet:
    address: ${SERVER_WALLET_ADDRESS}
    private-key: ${SERVER_WALLET_PRIVATE_KEY}
  receiver-wallet:
    address: ${RECEIVER_WALLET_ADDRESS}
  encryption:
    master-key: ${WALLET_ENCRYPTION_KEY}
  gas:
    price: 30000000000
    limit: 300000

payment:
  reconciliation:
    enabled: ${PAYMENT_RECONCILIATION_ENABLED:false}
    fixed-delay-ms: ${PAYMENT_RECONCILIATION_FIXED_DELAY_MS:60000}
    initial-delay-ms: ${PAYMENT_RECONCILIATION_INITIAL_DELAY_MS:30000}
    batch-size: ${PAYMENT_RECONCILIATION_BATCH_SIZE:50}
    retry-delay-minutes: ${PAYMENT_RECONCILIATION_RETRY_DELAY_MINUTES:5}
    stale-after-minutes: ${PAYMENT_RECONCILIATION_STALE_AFTER_MINUTES:10}
    max-attempts: ${PAYMENT_RECONCILIATION_MAX_ATTEMPTS:5}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
